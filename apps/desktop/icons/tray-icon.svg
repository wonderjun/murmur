  <g fill="#000000">
    <circle cx="12" cy="23" r="2.8"/>
    <circle cx="20" cy="16.5" r="4"/>
    <circle cx="29" cy="20.5" r="2.4"/>
  </g>
  <line x1="7" y1="33.5" x2="37" y2="33.5" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
</svg>
