<!--
  Murmur 菜单栏 template 图标母版（44 = 22pt @2x）。
  铁约：纯黑 + 透明底（template:true 系统自动适配明暗）；与 dock 同构的
  抽象点群波浪 + 栖枝，无具象鸟。改完用 icons/render.ts 重出 PNG。
-->
